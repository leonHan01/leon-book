<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src leoncanvas:; style-src leoncanvas: 'unsafe-inline'; img-src leoncanvas: https: http: data:; media-src leoncanvas: https: http:; frame-src https: http: leoncanvas:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>无限画布</title>
  <link rel="stylesheet" href="InfiniteCanvas.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-icon"><svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="3 3"/></svg></span><strong>无限画布</strong></div>
    <select id="boards" aria-label="选择画布"><option value="">选择画布</option></select>
    <button id="new-board" title="新建画布"><svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>新建</span></button>
    <input id="title" aria-label="画布名称" maxlength="200" placeholder="未命名画布" disabled>
    <span id="status" role="status" aria-live="polite">本地工作区</span>
    <button id="retry" hidden>重试保存</button>
    <details class="more"><summary aria-label="画布菜单"><svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg></summary><div class="menu">
      <button id="import">导入 .canvas…</button><button id="export">导出 .canvas…</button><button id="delete-board" class="danger">删除当前画布…</button>
    </div></details>
  </header>
  <main>
    <aside id="library" hidden>
      <div class="library-head"><strong>添加内容</strong><button id="close-library" aria-label="关闭内容面板"><svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
      <div class="tabs"><button data-kind="article" class="active">博客 / 文章</button><button data-kind="moment">微博</button></div>
      <input id="search" type="search" placeholder="搜索工作区内容…" aria-label="搜索工作区内容">
      <p class="muted small">点击加入画布 · 每次显示最多 100 项</p>
      <div id="results"></div>
    </aside>
    <section id="viewport" tabindex="0" aria-label="无限画布。拖动空白处平移，按住 Command 滚轮缩放，双击新建便签。">
      <div id="world"><svg id="edges" aria-label="卡片连线"></svg><div id="nodes"></div></div>
      <div id="marquee" hidden></div>
      <div id="welcome"><div class="welcome-symbol"><svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="3 3"/></svg></div><h1>让内容自由连接</h1><p>把文章、想法和素材放在一起，<br>用空间组织知识，用连线发现关系。</p><button id="start" class="primary">创建第一张画布</button><p class="small muted">保存在当前用户的本地工作区</p></div>
      <div id="empty-hint" hidden><strong>从一个想法开始</strong><p>双击空白处写便签，或从上方添加内容。</p></div>
      <nav id="tools" aria-label="添加内容与编辑画布" hidden>
        <button id="show-library" title="加入博客、文章或微博"><svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>内容</span></button>
        <button id="note" title="添加便签 (N)"><svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9l7-7V5a2 2 0 0 0-2-2ZM14 21v-7h7"/></svg><span>便签</span></button>
        <button id="link" title="添加网页 (L)"><svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3h8v8M21 3 11 13M9 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg><span>网页</span></button>
        <button id="file" title="添加图片、PDF、音视频或任意文件"><svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11 12 20a6 6 0 0 1-8.5-8.5l9-9a4 4 0 0 1 5.7 5.7L9 17.4a2 2 0 0 1-2.8-2.8l8.3-8.3"/></svg><span>文件</span></button>
        <button id="group" title="添加分组 (G)"><svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg><span>分组</span></button>
        <i></i><button id="undo" title="撤销 (⌘Z)" aria-label="撤销"><svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h10a5 5 0 0 1 0 10h-3M4 10l5-5M4 10l5 5"/></svg></button><button id="redo" title="重做 (⇧⌘Z)" aria-label="重做"><svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10H10a5 5 0 0 0 0 10h3M20 10l-5-5M20 10l-5 5"/></svg></button>
      </nav>
      <div id="selection-tools" hidden>
        <span id="selection-label"></span><input id="label" aria-label="分组或连线名称" placeholder="输入名称…" maxlength="200" hidden>
        <select id="color" aria-label="卡片或连线颜色"><option value="">默认</option><option value="1">红色</option><option value="2">橙色</option><option value="3">黄色</option><option value="4">绿色</option><option value="5">青色</option><option value="6">紫色</option></select>
        <button id="connect" title="连接到另一张卡片">连线</button><button id="duplicate">复制</button><button id="remove" class="danger">移除</button>
      </div>
      <div id="navigation" hidden><button id="zoom-out" aria-label="缩小"><svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><button id="zoom-reset" title="恢复 100%">100%</button><button id="zoom-in" aria-label="放大"><svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><i></i><button id="fit" title="显示全部卡片 (F)"><svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3H3v6M15 3h6v6M3 15v6h6M21 15v6h-6"/></svg><span>适应画布</span></button></div>
      <div id="hint" class="small muted" hidden>拖空白处平移 · ⌘滚轮缩放 · ⇧点击多选 · 拖卡片圆点连线</div>
      <div id="toast" role="alert" hidden></div>
    </section>
  </main>
  <dialog id="url-dialog"><form id="url-form"><h2>添加网页</h2><label>网页地址<input id="url-input" type="url" required placeholder="https://…"></label><p class="muted small">可在卡片内加载网页；不支持嵌入的网站可在浏览器中打开。</p><div class="dialog-actions"><button type="button" id="cancel-url">取消</button><button class="primary" type="submit">加入画布</button></div></form></dialog>
  <script src="InfiniteCanvas.js"></script>
</body>
</html>
