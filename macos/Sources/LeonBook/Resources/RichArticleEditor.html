<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src https: http: data: leonmedia:; media-src https: http: leonmedia:;">
<style>
:root { color-scheme: light dark; --surface: #fff; --text: #303238; --muted: #72737a; --line: #e9e9eb; --accent: #3976cf; --soft: #f5f5f6; --size: 18px; }
@media (prefers-color-scheme: dark) { :root { --surface: #252628; --text: #e4e5e8; --muted: #a1a2a8; --line: #3a3b3e; --soft: #2d2e31; --accent: #8abcf8; } }
* { box-sizing: border-box; }
body { margin: 0; background: transparent; color: var(--text); font: var(--size)/1.75 -apple-system, BlinkMacSystemFont, sans-serif; }
body:not(.readonly) { color-scheme: light; min-height: 100vh; background: #fff; --surface: #fff; --text: #303238; --muted: #72737a; --line: #e9e9eb; --accent: #3976cf; --soft: #f5f5f6; --block-hover: #e5f1ff; }
#toolbar { position: sticky; top: 0; z-index: 3; display: flex; justify-content: flex-end; padding: 0 28px 6px; background: var(--surface); font: 12px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; }
button, select, input { font: inherit; color: inherit; }
button { border: 0; border-radius: 6px; background: transparent; padding: 4px 9px; cursor: pointer; }
button:hover, button:focus-visible { background: var(--soft); outline: 2px solid var(--accent); outline-offset: -2px; }
#toolbar button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 32px; min-height: 30px; font-size: 13px; }
#tools-toggle { min-height: 30px; padding: 5px 8px; color: var(--muted); }
#toolbar svg { flex: 0 0 18px; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
#tools-toggle[aria-expanded=true] { background: var(--soft); color: var(--text); }
#toolbar-panel { position: absolute; top: 34px; right: 28px; width: 248px; max-width: calc(100vw - 32px); max-height: calc(100vh - 48px); overflow-y: auto; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); box-shadow: 0 8px 24px #00000012; }
#toolbar-panel[hidden] { display: none; }
.toolbar-group { display: flex; flex-wrap: wrap; gap: 4px; }
.toolbar-group + .toolbar-group { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.toolbar-group .group-title { flex-basis: 100%; margin-bottom: 2px; color: var(--muted); font-size: 11px; }
#language { max-width: 130px; font-size: 12px; border: 1px solid var(--line); border-radius: 5px; background: var(--soft); padding: 4px; }
#document { padding: 10px 28px 120px; min-height: 280px; outline: none; overflow-wrap: anywhere; }
#document > *, #document :is(td, th) > * { position: relative; margin: 0 0 14px; min-height: 1.75em; outline: none; }
#document :is(td, th) > :last-child { margin-bottom: 0; }
#document[contenteditable=true] > *:focus-within { border-radius: 4px; }
#document[contenteditable=true] > * { border-radius: 6px; }
#document[contenteditable=true] > *:hover { background-color: var(--block-hover); border-radius: 6px; outline: 4px solid var(--block-hover); }
#document[contenteditable=true] :is(th, td):hover { background-color: var(--block-hover); }
#document > p:only-child:has(>br:only-child)::before { content: var(--editor-placeholder); color: var(--muted); pointer-events: none; position: absolute; }
#document h1 { font-size: 1.8em; line-height: 1.4; font-weight: 720; margin-top: 20px; }
#document h2 { font-size: 1.4em; line-height: 1.5; margin-top: 16px; }
#document h3 { font-size: 1.15em; margin-top: 12px; }
#document h4 { font-size: 1em; font-weight: 650; margin-top: 10px; }
#document pre { white-space: pre-wrap; tab-size: 4; background: var(--soft); border: 1px solid var(--line); border-radius: 9px; padding: 34px 18px 16px; font: 14px/1.7 ui-monospace, Menlo, monospace; }
#document pre::before { content: attr(data-language); position: absolute; top: 8px; left: 18px; color: var(--muted); font: 11px/1.5 -apple-system, sans-serif; pointer-events: none; }
#document pre code { padding: 0; background: transparent; font: inherit; }
#document aside { background: #f4ca5130; border-left: 4px solid #d3a229; border-radius: 7px; padding: 14px 18px 14px 42px; }
#document aside::before { content: '✦'; position: absolute; left: 15px; color: #b98c22; pointer-events: none; }
#document blockquote { border-left: 3px solid var(--accent); padding: 6px 16px; color: var(--muted); }
#document [data-type=bullet], #document [data-type=number], #document [data-type=task] { padding-left: 28px; }
#document [data-type=bullet]::before { content: '•'; position: absolute; left: 8px; }
#document [data-type=number]::before { content: attr(data-number) '.'; position: absolute; left: 3px; color: var(--muted); }
#document [data-type=task]::before { content: '☐'; position: absolute; left: 2px; cursor: pointer; color: var(--accent); }
#document [data-type=task][data-checked=true]::before { content: '☑'; }
#document [data-checked=true] { color: var(--muted); text-decoration: line-through; }
#document hr { border: 0; border-top: 1px solid var(--line); min-height: 1px; margin: 24px 0; }
#document code { font: .88em ui-monospace, Menlo, monospace; background: var(--soft); border-radius: 4px; padding: 2px 4px; }
#document mark { background: #f2ce5e70; color: inherit; border-radius: 3px; }
#document a { color: var(--accent); text-decoration: underline; }
#document img { display: block; max-width: 100%; height: auto; border-radius: 8px; }
#document figure[data-type=audio] { padding: 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--soft); }
#document figure[data-type=audio]:focus { outline: 2px solid var(--accent); }
#document audio { display: block; width: 100%; max-width: 100%; }
#document[data-audio-drop=true] { box-shadow: inset 0 0 0 2px var(--accent); background: var(--soft); }
#document figure[data-type=audio] figcaption { margin-top: 6px; color: var(--muted); font-size: 12px; }
#document table { border-collapse: collapse; table-layout: fixed; width: 100%; }
#document th, #document td { border: 1px solid var(--line); padding: 10px 12px; min-width: 70px; vertical-align: top; }
#document :is(td, th) img { max-width: 100%; margin: 6px 0; }
#document th { background: var(--soft); }
#commands { position: fixed; z-index: 10; display: flex; flex-direction: column; width: 324px; max-width: calc(100vw - 24px); max-height: calc(100vh - 24px); overflow: hidden; padding: 0; border: 1px solid #dce2e9; border-radius: 14px; background: #fffffff7; color: #253044; box-shadow: 0 18px 48px -12px #26364b30, 0 4px 14px #26364b0d, inset 0 1px 0 #fff; font: 13px/1.45 -apple-system, BlinkMacSystemFont, sans-serif; -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); animation: command-appear 120ms ease-out; transform-origin: top left; }
#commands[hidden] { display: none; }
#commands[data-placement=above] { transform-origin: bottom left; }
#commands .command-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0; padding: 12px 14px 9px; border-bottom: 1px solid #edf0f4; }
#commands .command-header strong { font-size: 12px; font-weight: 600; letter-spacing: .02em; }
#commands .command-count { color: #929baa; font-size: 10px; }
#commands .command-list { min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 5px 6px 6px; scroll-padding-block: 6px; scrollbar-width: thin; scrollbar-color: #ccd4df transparent; }
#commands .command-list::-webkit-scrollbar { width: 5px; }
#commands .command-list::-webkit-scrollbar-thumb { border-radius: 5px; background: #ccd4df; }
#commands .command-group { padding: 8px 8px 5px; color: #98a1ae; font-size: 10px; font-weight: 500; letter-spacing: .04em; }
#commands button { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto 12px; align-items: center; gap: 9px; width: 100%; min-height: 48px; padding: 6px 8px; border: 0; border-radius: 8px; outline: none; background: transparent; text-align: left; line-height: 1.4; }
#commands button:hover, #commands button:focus-visible, #commands button[aria-selected=true] { background: #eaf3ff; outline: none; box-shadow: inset 0 0 0 1px #dfebfc; }
#commands .icon { display: grid; place-items: center; width: 30px; height: 30px; border: 1px solid #e7ebf1; border-radius: 8px; background: #f6f8fb; color: #69778b; }
#commands .icon svg { display: block; width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.55; stroke-linecap: round; stroke-linejoin: round; }
#commands .icon svg text { fill: currentColor; stroke: none; font: 7px -apple-system, sans-serif; }
#commands [data-command-id=callout] .icon { color: #af873b; background: #fff9e9; border-color: #f0e6c9; }
#commands button[aria-selected=true] .icon { color: #477cbd; border-color: #cfdef3; background: #f7fbff; }
#commands .label { min-width: 0; font-size: 13px; font-weight: 550; letter-spacing: .01em; }
#commands small { display: block; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #9099a6; font-size: 10px; font-weight: 400; letter-spacing: 0; }
#commands .command-alias { color: #99a3b1; font: 10px/1.5 ui-monospace, Menlo, monospace; }
#commands .command-enter { visibility: hidden; color: #6b92c1; font-size: 12px; }
#commands [aria-selected=true] .command-enter { visibility: visible; }
#commands .command-footer { display: flex; align-items: center; gap: 12px; flex-shrink: 0; padding: 8px 13px; border-top: 1px solid #edf0f4; background: #fafbfd; color: #a0a8b4; font-size: 10px; }
#commands .command-footer span { display: inline-flex; align-items: center; gap: 4px; }
#commands .command-footer kbd { padding: 0 3px; border: 1px solid #e3e8ef; border-radius: 3px; color: #7e8c9f; background: #fff; font: 10px/1.4 -apple-system, sans-serif; }
#commands .command-empty { padding: 22px 14px; text-align: center; color: #8692a2; font-size: 12px; }
@keyframes command-appear { from { opacity: 0; transform: translateY(3px) scale(.985); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #commands { animation: none; } }
#selection-toolbar { position: fixed; z-index: 12; display: flex; flex-wrap: wrap; align-items: center; gap: 2px; max-width: calc(100vw - 16px); padding: 5px; border: 1px solid #dce2e9; border-radius: 11px; background: #fffffff7; color: #39485d; box-shadow: 0 8px 28px -5px #26364b30, 0 2px 6px #26364b0a; -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
#selection-toolbar[hidden], #selection-colors[hidden], #selection-headings[hidden] { display: none; }
#selection-toolbar button { display: inline-flex; justify-content: center; align-items: center; gap: 4px; min-width: 30px; height: 30px; padding: 0 7px; border: 0; border-radius: 6px; background: transparent; color: inherit; font: 15px/1 -apple-system, sans-serif; outline: none; }
#selection-toolbar button:hover, #selection-toolbar button:focus-visible, #selection-toolbar button[aria-pressed=true], #selection-toolbar button[aria-expanded=true] { background: #eaf3ff; color: #477cbd; outline: none; }
#selection-toolbar .format-divider { width: 1px; height: 18px; margin: 0 4px; background: #e7ebf1; }
#selection-toolbar .text-color { position: relative; padding-bottom: 4px; }
#selection-toolbar .text-color::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 2px; background: var(--selected-text-color, #4b7dce); }
#selection-toolbar .background-color { padding: 2px 3px; border-radius: 3px; background: var(--selected-background-color, #fff0bb); color: #39485d; }
#selection-toolbar .format-chevron { width: 5px; height: 5px; margin: -3px 1px 0 2px; border-right: 1px solid #8e9aac; border-bottom: 1px solid #8e9aac; transform: rotate(45deg); }
#selection-toolbar .clear-format { font-size: 14px; }
#selection-toolbar .clear-format sub { color: #8996a8; font-size: 11px; }
#selection-toolbar [data-format=heading] { font-size: 13px; white-space: nowrap; }
#selection-toolbar button:disabled { opacity: .4; cursor: default; background: transparent; color: inherit; }
#selection-headings { position: fixed; z-index: 13; width: 180px; max-width: calc(100vw - 16px); max-height: calc(100vh - 16px); overflow-y: auto; padding: 6px; border: 1px solid #dce2e9; border-radius: 12px; background: #fff; color: #39485d; box-shadow: 0 12px 32px -5px #26364b30; font: 13px/1.4 -apple-system, sans-serif; }
#selection-headings button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; text-align: left; }
#selection-headings button:hover, #selection-headings button:focus-visible, #selection-headings button[aria-checked=true] { background: #eaf3ff; color: #477cbd; outline: none; }
#selection-headings .heading-icon { width: 24px; color: #8996a8; font-size: 15px; text-align: center; }
#selection-headings button[aria-checked=true]::after { content: '✓'; margin-left: auto; }
@media (max-width: 440px) {
  #selection-toolbar { gap: 0; }
  #selection-toolbar button { min-width: 28px; padding: 0 5px; gap: 3px; }
  #selection-toolbar .format-divider { margin: 0 2px; }
}
#selection-colors { position: fixed; z-index: 13; width: 218px; max-width: calc(100vw - 16px); padding: 12px; border: 1px solid #dce2e9; border-radius: 12px; background: #fff; color: #39485d; box-shadow: 0 12px 32px -5px #26364b30; font: 12px/1.4 -apple-system, sans-serif; }
#selection-colors .palette-title { margin: 0 0 10px; font-weight: 550; }
#selection-colors .palette-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
#selection-colors .color-swatch { display: grid; place-items: center; height: 30px; padding: 0; border: 1px solid #e7ebf1; border-radius: 6px; font: 15px/1 -apple-system, sans-serif; outline: none; }
#selection-colors .color-swatch:hover, #selection-colors .color-swatch:focus-visible, #selection-colors .color-swatch[aria-checked=true] { outline: 2px solid #8db2e5; outline-offset: 2px; }
#selection-colors .reset-color { width: 100%; margin-top: 12px; padding: 7px; border: 1px solid #e7ebf1; border-radius: 6px; background: #f7f9fc; color: #6c7b8f; font-size: 11px; outline: none; }
#selection-colors .reset-color:hover { background: #eaf3ff; color: #477cbd; }
body.readonly #toolbar { display: none; }
body.readonly #document { padding: 0 0 12px; min-height: 0; }
body.readonly #document p:only-child:has(>br:only-child)::before { content: none; }
/* editor-interactions-style */
/* editor-caret-style */
#document figure[data-type=whiteboard] { border:1px solid var(--line); border-radius:9px; padding:10px; cursor:pointer; }
#document figure[data-type=whiteboard] img { max-height:580px; object-fit:contain; width:100%; }
#document figure[data-type=whiteboard]:focus { outline:2px solid var(--accent); }
#whiteboard-tools { position:fixed; z-index:14; display:flex; gap:4px; padding:4px; border:1px solid var(--line); border-radius:8px; background:var(--surface); box-shadow:0 3px 15px #0002; font-size:12px; }
#whiteboard-tools[hidden] { display:none; }
</style>
</head>
<body>
<div id="toolbar" role="toolbar" aria-label="富文本格式">
  <button id="tools-toggle" type="button" aria-label="编辑工具" aria-expanded="false" aria-controls="toolbar-panel" title="编辑工具">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h4m4 0h10M3 17h10m4 0h4"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="17" r="2"/></svg><span>工具</span>
  </button>
  <div id="toolbar-panel" role="group" aria-label="编辑工具" hidden>
  <div class="toolbar-group"><span class="group-title">文字格式</span>
  <button data-command="bold" title="加粗 ⌘B"><b>B</b></button>
  <button data-command="italic" title="斜体 ⌘I"><i>I</i></button>
  <button data-command="underline" title="下划线 ⌘U"><u>U</u></button>
  <button data-command="strikeThrough" title="删除线"><s>S</s></button>
  <button data-command="highlight" title="高亮文字" aria-label="高亮文字"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16 4 4L20 8l-4-4ZM3 21h7"/></svg></button>
  <button data-command="link" title="添加链接" aria-label="添加链接"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></button>
  </div>
  <div class="toolbar-group"><span class="group-title">插入内容</span>
  <button data-command="whiteboard" title="插入 Excalidraw 画板" aria-label="画板"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="14" rx="2"/><path d="M12 17v4M7 21h10M7 12l3-4 3 3 4-4"/></svg><span class="tool-label">画板</span></button>
  <button data-command="audio" title="选择 MP3，或将 MP3 文件拖入正文" aria-label="插入音频"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13M9 9l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2"/><ellipse cx="17" cy="16" rx="3" ry="2"/></svg><span class="tool-label">插入音频</span></button>
  </div>
  <div class="toolbar-group"><span class="group-title">撤销与重做</span>
  <button data-command="undo" title="撤销 ⌘Z" aria-label="撤销"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h10a5 5 0 0 1 0 10h-3M4 10l5-5M4 10l5 5"/></svg></button>
  <button data-command="redo" title="重做 ⇧⌘Z" aria-label="重做"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10H10a5 5 0 0 0 0 10h3M20 10l-5-5M20 10l-5 5"/></svg></button>
  </div>
  <select id="language" aria-label="代码语言" hidden><option>text</option><option>javascript</option><option>typescript</option><option>swift</option><option>python</option><option>html</option><option>css</option><option>json</option><option>sql</option><option>bash</option></select>
  </div>
</div>
<article id="document" contenteditable="false" spellcheck="false" aria-label="文章富文本编辑器"></article>
<div id="commands" role="listbox" aria-label="快捷操作" hidden></div>
<div id="selection-toolbar" role="toolbar" aria-label="选区文字样式" hidden>
  <button type="button" data-format="heading" title="设置标题" aria-label="设置标题" aria-expanded="false" aria-controls="selection-headings"><span>标题</span><span class="format-chevron" aria-hidden="true"></span></button>
  <span class="format-divider" aria-hidden="true"></span>
  <button type="button" data-format="bold" title="加粗 ⌘B" aria-label="加粗" aria-pressed="false"><b>B</b></button>
  <button type="button" data-format="italic" title="斜体 ⌘I" aria-label="斜体" aria-pressed="false"><i>I</i></button>
  <button type="button" data-format="underline" title="下划线 ⌘U" aria-label="下划线" aria-pressed="false"><u>U</u></button>
  <button type="button" data-format="strikeThrough" title="删除线" aria-label="删除线" aria-pressed="false"><s>S</s></button>
  <span class="format-divider" aria-hidden="true"></span>
  <button type="button" data-format="foreColor" title="文字颜色" aria-label="文字颜色" aria-expanded="false" aria-controls="selection-colors"><span class="text-color">A</span><span class="format-chevron" aria-hidden="true"></span></button>
  <button type="button" data-format="hiliteColor" title="背景高亮" aria-label="背景高亮" aria-expanded="false" aria-controls="selection-colors"><span class="background-color">A</span><span class="format-chevron" aria-hidden="true"></span></button>
  <span class="format-divider" aria-hidden="true"></span>
  <button type="button" data-format="removeFormat" title="清除样式" aria-label="清除样式"><span class="clear-format">T<sub>×</sub></span></button>
</div>
<div id="selection-colors" role="dialog" aria-label="选择颜色" hidden></div>
<div id="selection-headings" role="radiogroup" aria-label="设置标题" hidden>
  <button type="button" data-heading="p" role="radio" aria-checked="false"><span class="heading-icon" aria-hidden="true">¶</span>正文</button>
  <button type="button" data-heading="h1" role="radio" aria-checked="false"><span class="heading-icon" aria-hidden="true">H₁</span>一级标题</button>
  <button type="button" data-heading="h2" role="radio" aria-checked="false"><span class="heading-icon" aria-hidden="true">H₂</span>二级标题</button>
  <button type="button" data-heading="h3" role="radio" aria-checked="false"><span class="heading-icon" aria-hidden="true">H₃</span>三级标题</button>
  <button type="button" data-heading="h4" role="radio" aria-checked="false"><span class="heading-icon" aria-hidden="true">H₄</span>四级标题</button>
</div>
<script>
(() => {
  'use strict';
  const t = (...args) => window.LeonL10n.text(...args);
  window.LeonL10n.bindChrome(document);
  const root = document.getElementById('document'), menu = document.getElementById('commands');
  const language = document.getElementById('language');
  const selectionToolbar = document.getElementById('selection-toolbar'), colorPanel = document.getElementById('selection-colors');
  const headingPanel = document.getElementById('selection-headings'), headingButton = selectionToolbar.querySelector('[data-format=heading]');
  const opening = '<article data-leon-format="html-v1">';
  const uuid = () => {
    const bytes = crypto.getRandomValues(new Uint8Array(16));
    bytes[6] = (bytes[6] & 15) | 64; bytes[8] = (bytes[8] & 63) | 128;
    const hex = [...bytes].map(byte => byte.toString(16).padStart(2, '0')).join('');
    return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`;
  };
  const commands = [
    { id: 'text', tag: 'p', label: '正文', detail: '普通段落', icon: '¶', aliases: 'paragraph 文本 正文' },
    { id: 'code', tag: 'pre', label: '代码框', detail: '保留缩进和换行，可选择语言', icon: '</>', aliases: '代码 代码块' },
    { id: 'callout', tag: 'aside', label: '高亮框', detail: '突出显示提示和重要信息', icon: '✦', aliases: 'note tip highlight 提示 高亮' },

    const clipboard = event.clipboardData; const block = blockAtSelection(); if (!clipboard || !block || !insertionRange()) return;
    checkpoint(); lastEdit = 0;
    if (block.tagName === 'PRE') { document.execCommand('insertText', false, clipboard.getData('text/plain')); notify(); return; }

    if (images.length) {
      const requestID = rememberImagePaste(); if (!requestID) return;
      Promise.all(images.map(file => new Promise((resolve, reject) => {
        const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = reject; reader.readAsDataURL(file);
      }))).then(sources => insertPastedImages(requestID, sources), () => { pendingImagePastes.delete(requestID); editorUI.imageProgress(pendingImagePastes.size, true); });
      return;
    }
    const html = clipboard.getData('text/html'); const text = clipboard.getData('text/plain').replace(/\r\n?|\u2029/g, '\n');
    if ([...clipboard.files].some(file => file.type.startsWith('image/')) || (!html && !text)) {
      const requestID = rememberImagePaste(); if (requestID) send({ type: 'pasteImage', requestID }); return;
    }
    if (html) document.execCommand('insertHTML', false, cleanHTML(html));
    else if (!text.includes('\n')) document.execCommand('insertText', false, text);
    else {
      const selection = window.getSelection(); const range = selection.getRangeAt(0); range.deleteContents();
      const tail = range.cloneRange(); tail.setEndAfter(block.lastChild || block); const remainder = tail.extractContents();
      const lines = text.split(/\n+/); range.insertNode(document.createTextNode(lines.shift())); let last = block;
      for (const line of lines) { const next = document.createElement('p'); next.textContent = line; last.after(next); last = next; }
      const caret = document.createRange(); caret.selectNodeContents(last); caret.collapse(false); last.append(remainder);
      selection.removeAllRanges(); selection.addRange(caret);
    }
    flattenPastedBlocks(); notify(); closeMenu();
  });
  function flattenPastedBlocks() {
    // Browsers may nest pasted paragraphs inside the active paragraph. Promote
    // those paragraphs so every paragraph remains a directly addressable block.
    for (const parent of [...root.children, ...root.querySelectorAll(':is(td,th) > :is(p,h1,h2,h3,h4)')]) {
      if (!['P', 'H1', 'H2', 'H3', 'H4'].includes(parent.tagName)) continue;
      const nested = [...parent.querySelectorAll('p,div,h1,h2,h3,h4,pre,aside,table,blockquote')].filter(child => child.parentElement === parent);
      let anchor = parent;
      for (const child of nested) { anchor.after(child); anchor = child; }
      if (!parent.textContent && !parent.querySelector('img')) parent.remove();

    for (const node of [...root.childNodes]) {
      if (node.nodeType === Node.TEXT_NODE) { const p = document.createElement('p'); p.textContent = node.textContent; node.replaceWith(p); }
    }
  }
  root.addEventListener('click', event => {
    const link = event.target.closest('a'); if (link && (!editable || event.metaKey)) { event.preventDefault(); send({ type: 'link', url: link.getAttribute('href') }); }
    const block = event.target.closest('[data-type=task]');
    if (block && !event.target.closest('img') && event.clientX - block.getBoundingClientRect().left < 26 && editable) { checkpoint(); block.dataset.checked = String(block.dataset.checked !== 'true'); notify(); }
  });
  document.addEventListener('selectionchange', () => {
    updateLanguage(); if (!composing) updateMenu(); updateSelectionToolbar();
    if (!editable) {
      const selection = getSelection();
      if (!root.contains(selection?.anchorNode) || selection.isCollapsed) resetReaderSelection();
      else if (!selectingWithPointer) scheduleReaderSelection();
    }
  });
  const toolbar = document.getElementById('toolbar');
  const toolsToggle = document.getElementById('tools-toggle');
  const toolsPanel = document.getElementById('toolbar-panel');
  let toolsSelection = null, toolsDocumentID = null;
  function restoreToolsSelection() {
    if (toolsDocumentID === documentID && toolsSelection) restoreSelection(toolsSelection);
  }
  function closeTools(restore = false) {
    if (restore) restoreToolsSelection();
    toolsPanel.hidden = true; toolsToggle.setAttribute('aria-expanded', 'false');
    toolsSelection = null; toolsDocumentID = null;
  }
  toolsToggle.addEventListener('click', () => {
    if (!editable || composing) return;
    if (!toolsPanel.hidden) { closeTools(true); return; }
    toolsSelection = captureSelection(); toolsDocumentID = documentID;
    hideSelectionToolbar(false); closeMenu();
    toolsPanel.hidden = false; toolsToggle.setAttribute('aria-expanded', 'true');
  });
  function runToolbarAction(button) {
    if (!button?.dataset.command || button.disabled || !editable || composing) return;
    restoreToolsSelection(); closeTools();
    const action = button.dataset.command;
    if (action === 'whiteboard') { whiteboards.create(blockAtSelection() || root.lastElementChild, false); return; }
    if (action === 'audio') { audioBlocks.create(blockAtSelection() || root.lastElementChild); return; }
    checkpoint();
    if (action === 'undo' || action === 'redo') { undo(action === 'undo' ? -1 : 1); return; }
    if (action === 'link') { send({ type: 'requestLink' }); return; }
    if (action === 'highlight') document.execCommand('hiliteColor', false, '#f2ce5e');
    else document.execCommand(action, false); notify();
  }
  toolbar.addEventListener('mousedown', event => {
    const button = event.target.closest('button'); if (!button) return;
    event.preventDefault();
    if (button !== toolsToggle) runToolbarAction(button);
  });
  toolbar.addEventListener('click', event => {
    if (event.detail === 0) runToolbarAction(event.target.closest('button'));
  });
  document.addEventListener('pointerdown', event => {
    if (!toolbar.contains(event.target)) closeTools();
  });
  toolbar.addEventListener('focusout', () => {
    setTimeout(() => { if (!toolbar.contains(document.activeElement)) closeTools(); }, 0);
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && !toolsPanel.hidden) { event.preventDefault(); closeTools(true); }
  });
  language.addEventListener('change', () => {
    const value = language.value;
    restoreToolsSelection();
    const block = blockAtSelection();
    if (block?.tagName === 'PRE') { checkpoint(); block.dataset.language = value; notify(); }
    closeTools();
  });
  function load(body, id, canEdit, size) {
    if (composing) { pendingLoad = [body, id, canEdit, size]; return false; }
    const changed = documentID !== id || serialize() !== body;
    if (documentID !== id) lastHeight = -1;
    documentID = id; editable = canEdit; document.body.classList.toggle('readonly', !editable);
    root.contentEditable = String(editable); document.documentElement.style.setProperty('--size', size + 'px');
    if (changed || !editable) { closeTools(); selectingWithPointer = false; resetReaderSelection(); hideSelectionToolbar(); pendingImagePastes.clear(); editorUI.reset(); whiteboards.reset(); audioBlocks.reset(); }
    if (changed) {
      const parsed = new DOMParser().parseFromString(body, 'text/html');
      root.innerHTML = cleanHTML(parsed.querySelector('article')?.innerHTML || '<p><br></p>');
      prepareBlocks(); history = [{ body: serialize(), selection: null }]; historyIndex = 0; lastEdit = 0; closeMenu();
    }

  }
  /* editor-interactions-script */
  const editorUI = createArticleInteractions({ root, canEdit: () => editable && !composing, checkpoint, notify, focusBlock, blockAtSelection, captureSelection, restoreSelection, execute, send, uuid, closeMenu, frameTask });
  /* editor-caret-script */
  const editorCaret = createArticleCaret({ root, canEdit: () => editable && !composing, frameTask });
  /* editor-whiteboards-script */
  const whiteboards = createArticleWhiteboards({ root, canEdit: () => editable && !composing, documentID: () => documentID, send, uuid, checkpoint, notify, focusBlock, closeMenu, frameTask });
  /* editor-audio-script */
  const audioBlocks = createArticleAudio({ root, canEdit: () => editable && !composing, documentID: () => documentID, send, uuid, checkpoint, notify, focusBlock, closeMenu });
  window.LeonArticle = { load, serialize, execute, commands, cleanHTML, undo, insertPastedImages,
    completeAudio: audioBlocks.complete, cancelAudio: audioBlocks.cancel,
    completeAudios: audioBlocks.completeMany,
    completeWhiteboard: whiteboards.complete, cancelWhiteboard: whiteboards.cancel,
    completeImageReplacement: editorUI.completeImageReplacement,
    insertLink(url) { const safe = safeURL(url); if (editable && safe) { checkpoint(); document.execCommand('createLink', false, safe); notify(); } },
    scrollToHeading(index) { root.querySelectorAll('h1,h2,h3,h4')[index]?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  };
  new ResizeObserver(scheduleResize).observe(root);
  window.addEventListener('resize', frameTask(() => { resize(); positionMenu(); positionSelectionToolbar(); }));
  window.addEventListener('scroll', frameTask(() => { positionMenu(); positionSelectionToolbar(); }), { passive: true });
  window.addEventListener('blur', () => { selectingWithPointer = false; scheduleReaderSelection.cancel(); hideSelectionToolbar(); });
  window.addEventListener('leonlanguagechange', () => { closeMenu(); colorPanel.hidden = headingPanel.hidden = true; });
  send({ type: 'ready' });
})();
