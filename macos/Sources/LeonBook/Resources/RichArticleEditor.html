<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src https: http: data: leonmedia:;">
<style>
:root { color-scheme: light dark; --surface: #fff; --text: #252827; --muted: #848a86; --line: #e4e8e5; --accent: #328568; --soft: #f4f6f4; --size: 18px; }
@media (prefers-color-scheme: dark) { :root { --surface: #222522; --text: #e5e9e5; --muted: #9ca69e; --line: #3c433d; --soft: #2b302c; --accent: #86c7a5; } }
* { box-sizing: border-box; }
body { margin: 0; background: transparent; color: var(--text); font: var(--size)/1.75 -apple-system, BlinkMacSystemFont, sans-serif; }
body:not(.readonly) { color-scheme: light; min-height: 100vh; background: #f5f5f4; --surface: #fafaf9; --text: #252827; --muted: #7c827f; --line: #dedfdd; --accent: #328568; --soft: #edeeec; --block-hover: #e5f1ff; }
#toolbar { position: sticky; top: 0; z-index: 3; display: flex; flex-wrap: wrap; align-items: center; gap: 3px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
button, select, input { font: inherit; color: inherit; }
button { border: 0; border-radius: 6px; background: transparent; padding: 4px 9px; cursor: pointer; }
button:hover, button:focus-visible { background: var(--soft); outline: 2px solid var(--accent); outline-offset: -2px; }
#toolbar button { min-width: 32px; font-size: 15px; }
#toolbar .hint { margin-left: auto; font-size: 12px; color: var(--muted); }
#language { max-width: 130px; font-size: 12px; border: 1px solid var(--line); border-radius: 5px; background: var(--soft); padding: 4px; }
#document { padding: 22px 28px 120px; min-height: 280px; outline: none; overflow-wrap: anywhere; }
#document > *, #document :is(td, th) > * { position: relative; margin: 0 0 14px; min-height: 1.75em; outline: none; }
#document :is(td, th) > :last-child { margin-bottom: 0; }
#document[contenteditable=true] > *:focus-within { border-radius: 4px; }
#document[contenteditable=true] > * { transition: background-color 120ms ease, box-shadow 120ms ease; }
#document[contenteditable=true] > *:hover { background-color: var(--block-hover); border-radius: 6px; box-shadow: 0 0 0 4px var(--block-hover); }
#document[contenteditable=true] > table:hover :is(th, td) { background-color: var(--block-hover); }
#document > p:only-child:has(>br:only-child)::before { content: '输入文字，或输入 / 添加内容块'; color: var(--muted); pointer-events: none; position: absolute; }
#document h1 { font-size: 1.8em; line-height: 1.4; font-weight: 720; margin-top: 20px; }
#document h2 { font-size: 1.4em; line-height: 1.5; margin-top: 16px; }
#document h3 { font-size: 1.15em; margin-top: 12px; }
#document pre { white-space: pre-wrap; tab-size: 4; background: var(--soft); border: 1px solid var(--line); border-radius: 9px; padding: 34px 18px 16px; font: 14px/1.7 ui-monospace, Menlo, monospace; }
#document pre::before { content: attr(data-language); position: absolute; top: 8px; left: 18px; color: var(--muted); font: 11px/1.5 -apple-system, sans-serif; pointer-events: none; }
#document pre code { padding: 0; background: transparent; font: inherit; }
#document aside { background: #f4ca5130; border-left: 4px solid #d3a229; border-radius: 7px; padding: 14px 18px 14px 42px; }
#document aside::before { content: '✦'; position: absolute; left: 15px; color: #b98c22; pointer-events: none; }
#document blockquote { border-left: 3px solid var(--accent); padding: 6px 16px; color: var(--muted); }
#document [data-type=bullet], #document [data-type=number], #document [data-type=task] { padding-left: 28px; }
#document [data-type=bullet]::before { content: '•'; position: absolute; left: 8px; }
#document [data-type=number]::before { content: attr(data-number) '.'; position: absolute; left: 3px; color: var(--muted); }
#document [data-type=task]::before { content: '☐'; position: absolute; left: 2px; cursor: pointer; color: var(--accent); }
#document [data-type=task][data-checked=true]::before { content: '☑'; }
#document [data-checked=true] { color: var(--muted); text-decoration: line-through; }
#document hr { border: 0; border-top: 1px solid var(--line); min-height: 1px; margin: 24px 0; }
#document code { font: .88em ui-monospace, Menlo, monospace; background: var(--soft); border-radius: 4px; padding: 2px 4px; }
#document mark { background: #f2ce5e70; color: inherit; border-radius: 3px; }
#document a { color: var(--accent); text-decoration: underline; }
#document img { display: block; max-width: 100%; height: auto; border-radius: 8px; }
#document table { border-collapse: collapse; table-layout: fixed; width: 100%; }
#document th, #document td { border: 1px solid var(--line); padding: 10px 12px; min-width: 70px; vertical-align: top; }
#document :is(td, th) img { max-width: 100%; margin: 6px 0; }
#document th { background: var(--soft); }
#commands { position: fixed; z-index: 10; display: flex; flex-direction: column; width: 324px; max-width: calc(100vw - 24px); max-height: calc(100vh - 24px); overflow: hidden; padding: 0; border: 1px solid #dce2e9; border-radius: 14px; background: #fffffff7; color: #253044; box-shadow: 0 18px 48px -12px #26364b30, 0 4px 14px #26364b0d, inset 0 1px 0 #fff; font: 13px/1.45 -apple-system, BlinkMacSystemFont, sans-serif; -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); animation: command-appear 120ms ease-out; transform-origin: top left; }
#commands[hidden] { display: none; }
#commands[data-placement=above] { transform-origin: bottom left; }
#commands .command-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0; padding: 12px 14px 9px; border-bottom: 1px solid #edf0f4; }
#commands .command-header strong { font-size: 12px; font-weight: 600; letter-spacing: .02em; }
#commands .command-count { color: #929baa; font-size: 10px; }
#commands .command-list { min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 5px 6px 6px; scroll-padding-block: 6px; scrollbar-width: thin; scrollbar-color: #ccd4df transparent; }
#commands .command-list::-webkit-scrollbar { width: 5px; }
#commands .command-list::-webkit-scrollbar-thumb { border-radius: 5px; background: #ccd4df; }
#commands .command-group { padding: 8px 8px 5px; color: #98a1ae; font-size: 10px; font-weight: 500; letter-spacing: .04em; }
#commands button { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto 12px; align-items: center; gap: 9px; width: 100%; min-height: 48px; padding: 6px 8px; border: 0; border-radius: 8px; outline: none; background: transparent; text-align: left; line-height: 1.4; }
#commands button:hover, #commands button:focus-visible, #commands button[aria-selected=true] { background: #eaf3ff; outline: none; box-shadow: inset 0 0 0 1px #dfebfc; }
#commands .icon { display: grid; place-items: center; width: 30px; height: 30px; border: 1px solid #e7ebf1; border-radius: 8px; background: #f6f8fb; color: #69778b; }
#commands .icon svg { display: block; width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.55; stroke-linecap: round; stroke-linejoin: round; }
#commands .icon svg text { fill: currentColor; stroke: none; font: 7px -apple-system, sans-serif; }
#commands [data-command-id=callout] .icon { color: #af873b; background: #fff9e9; border-color: #f0e6c9; }
#commands button[aria-selected=true] .icon { color: #477cbd; border-color: #cfdef3; background: #f7fbff; }
#commands .label { min-width: 0; font-size: 13px; font-weight: 550; letter-spacing: .01em; }
#commands small { display: block; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #9099a6; font-size: 10px; font-weight: 400; letter-spacing: 0; }
#commands .command-alias { color: #99a3b1; font: 10px/1.5 ui-monospace, Menlo, monospace; }
#commands .command-enter { visibility: hidden; color: #6b92c1; font-size: 12px; }
#commands [aria-selected=true] .command-enter { visibility: visible; }
#commands .command-footer { display: flex; align-items: center; gap: 12px; flex-shrink: 0; padding: 8px 13px; border-top: 1px solid #edf0f4; background: #fafbfd; color: #a0a8b4; font-size: 10px; }
#commands .command-footer span { display: inline-flex; align-items: center; gap: 4px; }
#commands .command-footer kbd { padding: 0 3px; border: 1px solid #e3e8ef; border-radius: 3px; color: #7e8c9f; background: #fff; font: 10px/1.4 -apple-system, sans-serif; }
#commands .command-empty { padding: 22px 14px; text-align: center; color: #8692a2; font-size: 12px; }
@keyframes command-appear { from { opacity: 0; transform: translateY(3px) scale(.985); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #commands { animation: none; } }
#selection-toolbar { position: fixed; z-index: 12; display: flex; align-items: center; gap: 2px; max-width: calc(100vw - 16px); padding: 5px; border: 1px solid #dce2e9; border-radius: 11px; background: #fffffff7; color: #39485d; box-shadow: 0 8px 28px -5px #26364b30, 0 2px 6px #26364b0a; -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
#selection-toolbar[hidden], #selection-colors[hidden] { display: none; }
#selection-toolbar button { display: inline-flex; justify-content: center; align-items: center; gap: 4px; min-width: 30px; height: 30px; padding: 0 7px; border: 0; border-radius: 6px; background: transparent; color: inherit; font: 15px/1 -apple-system, sans-serif; outline: none; }
#selection-toolbar button:hover, #selection-toolbar button:focus-visible, #selection-toolbar button[aria-pressed=true], #selection-toolbar button[aria-expanded=true] { background: #eaf3ff; color: #477cbd; outline: none; }
#selection-toolbar .format-divider { width: 1px; height: 18px; margin: 0 4px; background: #e7ebf1; }
#selection-toolbar .text-color { position: relative; padding-bottom: 4px; }
#selection-toolbar .text-color::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 2px; background: var(--selected-text-color, #4b7dce); }
#selection-toolbar .background-color { padding: 2px 3px; border-radius: 3px; background: var(--selected-background-color, #fff0bb); color: #39485d; }
#selection-toolbar .format-chevron { width: 5px; height: 5px; margin: -3px 1px 0 2px; border-right: 1px solid #8e9aac; border-bottom: 1px solid #8e9aac; transform: rotate(45deg); }
#selection-toolbar .clear-format { font-size: 14px; }
#selection-toolbar .clear-format sub { color: #8996a8; font-size: 11px; }
#selection-colors { position: fixed; z-index: 13; width: 218px; max-width: calc(100vw - 16px); padding: 12px; border: 1px solid #dce2e9; border-radius: 12px; background: #fff; color: #39485d; box-shadow: 0 12px 32px -5px #26364b30; font: 12px/1.4 -apple-system, sans-serif; }
#selection-colors .palette-title { margin: 0 0 10px; font-weight: 550; }
#selection-colors .palette-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
#selection-colors .color-swatch { display: grid; place-items: center; height: 30px; padding: 0; border: 1px solid #e7ebf1; border-radius: 6px; font: 15px/1 -apple-system, sans-serif; outline: none; }
#selection-colors .color-swatch:hover, #selection-colors .color-swatch:focus-visible, #selection-colors .color-swatch[aria-checked=true] { outline: 2px solid #8db2e5; outline-offset: 2px; }
#selection-colors .reset-color { width: 100%; margin-top: 12px; padding: 7px; border: 1px solid #e7ebf1; border-radius: 6px; background: #f7f9fc; color: #6c7b8f; font-size: 11px; outline: none; }
#selection-colors .reset-color:hover { background: #eaf3ff; color: #477cbd; }
body.readonly #toolbar { display: none; }
body.readonly #document { padding: 0 0 12px; min-height: 0; }
body.readonly #document p:only-child:has(>br:only-child)::before { content: none; }
</style>
</head>
<body>
<div id="toolbar" role="toolbar" aria-label="富文本格式">
  <button data-command="bold" title="加粗 ⌘B"><b>B</b></button>
  <button data-command="italic" title="斜体 ⌘I"><i>I</i></button>
  <button data-command="underline" title="下划线 ⌘U"><u>U</u></button>
  <button data-command="strikeThrough" title="删除线"><s>S</s></button>
  <button data-command="highlight" title="高亮文字">▰</button>
  <button data-command="link" title="添加链接">↗</button>
  <button data-command="undo" title="撤销 ⌘Z">↶</button>
  <button data-command="redo" title="重做 ⇧⌘Z">↷</button>
  <select id="language" aria-label="代码语言" hidden><option>text</option><option>javascript</option><option>typescript</option><option>swift</option><option>python</option><option>html</option><option>css</option><option>json</option><option>sql</option><option>bash</option></select>
  <span class="hint">/ 添加块 · 回车分段 · ⇧回车换行</span>
</div>
<article id="document" contenteditable="false" spellcheck="false" aria-label="文章富文本编辑器"></article>
<div id="commands" role="listbox" aria-label="快捷操作" hidden></div>
<div id="selection-toolbar" role="toolbar" aria-label="选区文字样式" hidden>
  <button type="button" data-format="bold" title="加粗 ⌘B" aria-label="加粗" aria-pressed="false"><b>B</b></button>
  <button type="button" data-format="italic" title="斜体 ⌘I" aria-label="斜体" aria-pressed="false"><i>I</i></button>
  <button type="button" data-format="underline" title="下划线 ⌘U" aria-label="下划线" aria-pressed="false"><u>U</u></button>
  <button type="button" data-format="strikeThrough" title="删除线" aria-label="删除线" aria-pressed="false"><s>S</s></button>
  <span class="format-divider" aria-hidden="true"></span>
  <button type="button" data-format="foreColor" title="文字颜色" aria-label="文字颜色" aria-expanded="false" aria-controls="selection-colors"><span class="text-color">A</span><span class="format-chevron" aria-hidden="true"></span></button>
  <button type="button" data-format="hiliteColor" title="背景高亮" aria-label="背景高亮" aria-expanded="false" aria-controls="selection-colors"><span class="background-color">A</span><span class="format-chevron" aria-hidden="true"></span></button>
  <span class="format-divider" aria-hidden="true"></span>
  <button type="button" data-format="removeFormat" title="清除样式" aria-label="清除样式"><span class="clear-format">T<sub>×</sub></span></button>
</div>
<div id="selection-colors" role="dialog" aria-label="选择颜色" hidden></div>
<script>
(() => {
  'use strict';
  const root = document.getElementById('document'), menu = document.getElementById('commands');
  const language = document.getElementById('language');
  const selectionToolbar = document.getElementById('selection-toolbar'), colorPanel = document.getElementById('selection-colors');
  const opening = '<article data-leon-format="html-v1">';
  const uuid = () => {
    const bytes = crypto.getRandomValues(new Uint8Array(16));
    bytes[6] = (bytes[6] & 15) | 64; bytes[8] = (bytes[8] & 63) | 128;
    const hex = [...bytes].map(byte => byte.toString(16).padStart(2, '0')).join('');
    return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`;
  };
  const commands = [
    { id: 'text', tag: 'p', label: '正文', detail: '普通段落', icon: '¶', aliases: 'paragraph 文本 正文' },
    { id: 'code', tag: 'pre', label: '代码框', detail: '保留缩进和换行，可选择语言', icon: '</>', aliases: '代码 代码块' },
    { id: 'callout', tag: 'aside', label: '高亮框', detail: '突出显示提示和重要信息', icon: '✦', aliases: 'note tip highlight 提示 高亮' },
    { id: 'h1', tag: 'h1', label: '一级标题', detail: '最大的章节标题', icon: 'H₁', aliases: 'heading title 标题' },
    { id: 'h2', tag: 'h2', label: '二级标题', detail: '章节标题', icon: 'H₂', aliases: 'heading subtitle 标题' },
    { id: 'h3', tag: 'h3', label: '三级标题', detail: '小节标题', icon: 'H₃', aliases: 'heading 标题' },
    { id: 'quote', tag: 'blockquote', label: '引用', detail: '引用一段内容', icon: '“', aliases: '引用' },
    { id: 'bullet', tag: 'p', label: '项目列表', detail: '无序列表项', icon: '•', aliases: 'list ul 列表 无序' },
    { id: 'number', tag: 'p', label: '编号列表', detail: '有序列表项', icon: '1.', aliases: 'list ol numbered 编号 有序' },
    { id: 'task', tag: 'p', label: '待办', detail: '可勾选的任务', icon: '☐', aliases: 'todo checkbox 待办 任务' },
    { id: 'table', tag: 'table', label: '表格', detail: '两列表格，可直接编辑单元格', icon: '▦', aliases: 'grid 表格' },
    { id: 'divider', tag: 'hr', label: '分割线', detail: '分隔上下内容', icon: '—', aliases: 'hr rule 分割线' }
  ];
  const commandIcons = {
    text: '<path d="M4 5h12M10 5v11M7 16h6"/>',
    h1: '<path d="M3 5v10M10 5v10M3 10h7"/><text x="13" y="16">1</text>',
    h2: '<path d="M3 5v10M10 5v10M3 10h7"/><text x="13" y="16">2</text>',
    h3: '<path d="M3 5v10M10 5v10M3 10h7"/><text x="13" y="16">3</text>',
    code: '<path d="m6 5-4 5 4 5m8-10 4 5-4 5M12 3 8 17"/>',
    callout: '<rect x="3" y="3" width="14" height="14" rx="4"/><path d="M10 6.5v4M10 13.5h.01"/>',
    quote: '<path d="M8 5H3v6h5V5Zm9 0h-5v6h5V5ZM8 11c0 3-1 4-3 4m12-4c0 3-1 4-3 4"/>',
    bullet: '<path d="M8 5h9M8 10h9M8 15h9"/><circle cx="3.5" cy="5" r=".8"/><circle cx="3.5" cy="10" r=".8"/><circle cx="3.5" cy="15" r=".8"/>',
    number: '<path d="M9 6h8M9 14h8M3 4h1v5M3 9h2M2.5 12c2-2 4 0 1.5 2l-1.5 2H6"/>',
    task: '<rect x="3" y="3" width="14" height="14" rx="3"/><path d="m6.5 10 2.5 2.5 4.5-5"/>',
    table: '<rect x="3" y="4" width="14" height="12" rx="2"/><path d="M3 8h14M3 12h14M9 4v12"/>',
    divider: '<path d="M3 10h14M6 5h8M6 15h8"/>'
  };
  const allowed = new Set('P H1 H2 H3 PRE CODE ASIDE BLOCKQUOTE TABLE TBODY THEAD TR TH TD STRONG B EM I U S STRIKE MARK A BR IMG HR SPAN UL OL LI'.split(' '));
  const attributes = new Set(['data-block-id', 'data-type', 'data-depth', 'data-checked', 'data-number', 'data-language']);
  const blockTags = new Set('P H1 H2 H3 PRE ASIDE BLOCKQUOTE TABLE UL OL LI HR'.split(' '));
  const pendingImagePastes = new Map();
  let documentID = '', editable = false, composing = false, pendingLoad = null;
  let matches = [], menuIndex = 0, slashBlock = null, history = [], historyIndex = -1, lastEdit = 0;
  let formatRange = null, formatDocumentID = '', colorMode = null, selectingWithPointer = false;
  const send = payload => window.webkit?.messageHandlers?.richArticle?.postMessage({ ...payload, documentID });
  const safeURL = (value, image = false) => {
    const url = (value || '').trim();
    if (image && /^data:image\/(png|jpeg|gif|webp);base64,/i.test(url)) return url;
    if (/^(https?:|mailto:|leonbook:)/i.test(url) || /^\/(?!\/)|^(?![a-z][a-z0-9+.-]*:)[^\s]+$/i.test(url)) return url;
    return '';
  };
  function safeColor(value) {
    const color = String(value || '').trim();
    if (!/^(?:#[\da-f]{3,4}|#[\da-f]{6}(?:[\da-f]{2})?|rgba?\([\d.,%\s/]+\)|[a-z]+)$/i.test(color)) return '';
    const style = document.createElement('span').style; style.color = color; return style.color;
  }
  function cleanHTML(html) {
    const container = document.createElement('template'); container.innerHTML = html;
    function clean(parent) {
      for (let node of [...parent.childNodes]) {
        if (node.nodeType === Node.COMMENT_NODE) { node.remove(); continue; }
        if (node.nodeType !== Node.ELEMENT_NODE) continue;
        if (node.tagName === 'DIV') { const paragraph = document.createElement('p'); paragraph.append(...node.childNodes); node.replaceWith(paragraph); node = paragraph; }
        if (node.tagName === 'FONT') {
          const span = document.createElement('span'); const color = safeColor(node.getAttribute('color'));
          if (color) span.style.color = color; span.append(...node.childNodes); node.replaceWith(span); node = span;
        }
        if (['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'SVG', 'MATH', 'FORM', 'INPUT'].includes(node.tagName)) { node.remove(); continue; }
        clean(node);
        if (!allowed.has(node.tagName)) { node.replaceWith(...node.childNodes); continue; }
        const foreground = safeColor(node.style.color), background = safeColor(node.style.backgroundColor);
        const normalWeight = node.tagName === 'SPAN' && /^(normal|[1-5]00)$/.test(node.style.fontWeight);
        if (node.tagName === 'SPAN') {
          const wrappers = [];
          if (/bold|[6-9]00/.test(node.style.fontWeight)) wrappers.push('strong');
          if (node.style.fontStyle === 'italic') wrappers.push('em');
          if (node.style.textDecoration.includes('line-through')) wrappers.push('s');
          if (node.style.textDecoration.includes('underline')) wrappers.push('u');
          for (const tag of wrappers) { const wrap = document.createElement(tag); wrap.append(...node.childNodes); node.append(wrap); }
        }
        for (const attr of [...node.attributes]) {
          const keep = attributes.has(attr.name) || (node.tagName === 'A' && attr.name === 'href')
            || (node.tagName === 'IMG' && ['src', 'alt', 'data-original-src'].includes(attr.name));
          if (!keep) node.removeAttribute(attr.name);
        }
        if (node.tagName === 'A') {
          const href = safeURL(node.getAttribute('href')); if (href) node.setAttribute('href', href); else node.removeAttribute('href');
        }
        if (node.tagName === 'IMG') {
          const src = safeURL(node.dataset.originalSrc || node.getAttribute('src'), true);
          if (src) { node.setAttribute('src', src); delete node.dataset.originalSrc; } else node.remove();
        }
        if (foreground) node.style.color = foreground;
        if (background && background !== 'transparent') node.style.backgroundColor = background;
        if (normalWeight) node.style.fontWeight = 'normal';
        if (node.tagName === 'SPAN' && !node.style.length) node.replaceWith(...node.childNodes);
      }
    }
    clean(container.content); return container.innerHTML;
  }
  function serialize() { return opening + cleanHTML(root.innerHTML) + '</article>'; }
  function cellFor(node) {
    const element = node?.nodeType === Node.ELEMENT_NODE ? node : node?.parentElement;
    return element && root.contains(element) ? element.closest('td,th') : null;

    if ([...clipboard.files].some(file => file.type.startsWith('image/')) || (!html && !text)) {

    }

      const lines = text.split(/\n+/); range.insertNode(document.createTextNode(lines.shift())); let last = block;
      for (const line of lines) { const next = document.createElement('p'); next.textContent = line; last.after(next); last = next; }
      const caret = document.createRange(); caret.selectNodeContents(last); caret.collapse(false); last.append(remainder);
      selection.removeAllRanges(); selection.addRange(caret);
    }
    flattenPastedBlocks(); notify(); closeMenu();
  });
  function flattenPastedBlocks() {
    // Browsers may nest pasted paragraphs inside the active paragraph. Promote
    // those paragraphs so every paragraph remains a directly addressable block.
    for (const parent of [...root.children, ...root.querySelectorAll('td > p,td > h1,td > h2,td > h3,th > p,th > h1,th > h2,th > h3')]) {
      if (!['P', 'H1', 'H2', 'H3'].includes(parent.tagName)) continue;
      const nested = [...parent.querySelectorAll('p,div,h1,h2,h3,pre,aside,table,blockquote')].filter(child => child.parentElement === parent);

  }
  root.addEventListener('click', event => {
    const link = event.target.closest('a'); if (link && (!editable || event.metaKey)) { event.preventDefault(); send({ type: 'link', url: link.getAttribute('href') }); }

  });

    const action = button.dataset.command;

    else document.execCommand(action, false); notify();
  });
  language.addEventListener('change', () => { const block = blockAtSelection(); if (block?.tagName === 'PRE') { block.dataset.language = language.value; notify(); } });
  function load(body, id, canEdit, size) {
    if (composing) { pendingLoad = [body, id, canEdit, size]; return false; }
    const changed = documentID !== id || serialize() !== body;
    documentID = id; editable = canEdit; document.body.classList.toggle('readonly', !editable);

      const parsed = new DOMParser().parseFromString(body, 'text/html');

  }
  window.LeonArticle = { load, serialize, execute, commands, cleanHTML, undo, insertPastedImages,
    insertLink(url) { const safe = safeURL(url); if (editable && safe) { document.execCommand('createLink', false, safe); notify(); } },
    scrollToHeading(index) { root.querySelectorAll('h1,h2,h3')[index]?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  };
  new ResizeObserver(resize).observe(root);
  window.addEventListener('resize', () => { resize(); positionMenu(); positionSelectionToolbar(); });
  window.addEventListener('scroll', () => { positionMenu(); positionSelectionToolbar(); });
  window.addEventListener('blur', () => { selectingWithPointer = false; hideSelectionToolbar(); });
  send({ type: 'ready' });
})();
