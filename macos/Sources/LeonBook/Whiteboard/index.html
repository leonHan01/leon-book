<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src leonboard: 'unsafe-inline'; style-src leonboard: 'unsafe-inline'; img-src leonboard: data: blob:; font-src leonboard: data:; connect-src leonboard: data: blob:; worker-src blob:;">
  <link rel="stylesheet" href="editor.css">
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; font:13px -apple-system,sans-serif; background:#fff; color:#343a40; }
    body { display:flex; flex-direction:column; }
    header { flex:none; height:54px; display:flex; align-items:center; gap:10px; padding:0 16px; border-bottom:1px solid #e9ecef; }
    header strong { font-size:14px; } #status { color:#6c757d; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    header button { border:1px solid #dedee5; border-radius:8px; padding:7px 13px; background:#fff; color:#343a40; font:inherit; cursor:pointer; }
    header button:disabled { opacity:.45; cursor:default; } #save { background:#328568; border-color:#328568; color:white; }
    #app { flex:1; min-height:0; position:relative; } #message { padding:32px; color:#68746c; }
  </style>
</head>
<body>
  <header><strong>文章画板</strong><span id="status" role="status">正在加载画板…</span><button id="cancel">取消</button><button id="save" disabled>保存到文章</button></header>
  <div id="app"><div id="message">正在加载 Excalidraw…</div></div>
  <script>window.EXCALIDRAW_ASSET_PATH = 'leonboard://app/';</script>
  <script src="editor.js"></script>
</body>
</html>
